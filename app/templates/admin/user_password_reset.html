{% extends "layout.html" %}

{% block content %}
<div class="container-fluid mt-4">
    <h2>パスワード初期化</h2>

    <div class="row mt-4">
        <div class="col-md-6">
            <div class="card mb-4">
                <div class="card-body">
                    <p><strong>ユーザーID:</strong> <code>{{ user.login_id }}</code></p>
                    <p><strong>表示名:</strong> {{ user.display_name }}</p>
                    <p><strong>メールアドレス:</strong> {{ user.email }}</p>
                </div>
            </div>

            <form method="POST">
                <div class="mb-3">
                    <label for="password" class="form-label">新しいパスワード <span class="text-danger">*</span></label>
                    <input type="password" id="password" name="password" class="form-control" required>
                    <small class="form-text text-muted">8文字以上</small>
                </div>

                <div class="mb-3">
                    <label for="password_confirm" class="form-label">新しいパスワード確認 <span class="text-danger">*</span></label>
                    <input type="password" id="password_confirm" name="password_confirm" class="form-control" required>
                </div>

                <div class="mb-3">
                    <a href="{{ url_for('admin_users.users_list') }}" class="btn btn-secondary">
                        キャンセル
                    </a>
                    <button type="submit" class="btn btn-primary">
                        パスワードを更新
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
