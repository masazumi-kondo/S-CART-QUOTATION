{% extends "layout.html" %}
{% block content %}

<style type="text/css">
    html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
    }
    
    .print-header {
        background-color: #f5f5f5;
        border-bottom: 1px solid #ddd;
        padding: 12px 16px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 16px;
    }
    
    .print-header-title {
        font-size: 18px;
        font-weight: bold;
        color: #163a70;
        margin: 0;
    }
    
    .print-actions {
        display: flex;
        gap: 8px;
        align-items: center;
    }
    
    .print-actions a, .print-actions button {
        padding: 8px 16px;
        background-color: #163a70;
        color: white;
        border: none;
        border-radius: 4px;
        cursor: pointer;
        text-decoration: none;
        font-size: 14px;
        transition: background-color 0.2s;
    }
    
    .print-actions a:hover, .print-actions button:hover {
        background-color: #0f2850;
    }
    
    .print-actions .btn-secondary {
        background-color: #666;
    }
    
    .print-actions .btn-secondary:hover {
        background-color: #444;
    }
    
    .print-container {
        width: 100%;
        height: calc(100vh - 60px);
        display: flex;
        justify-content: center;
        background-color: #e0e0e0;
        overflow: auto;
    }
    
    .pdf-preview {
        width: 100%;
        height: 100%;
        border: none;
    }
</style>

<div class="print-header">
    <h1 class="print-header-title">見積書PDFプレビュー</h1>
    <div class="print-actions">
        <button onclick="window.print()" title="印刷">
            <i class="fas fa-print"></i> 印刷
        </button>
        <a href="{{ url_for('quotation.quotation_pdf', quotation_id=quotation.id) }}" download="{{ quotation.quotation_no or 'quotation' }}.pdf" title="ダウンロード">
            <i class="fas fa-download"></i> ダウンロード
        </a>
        <a href="{{ url_for('quotation.quotation_list') }}" class="btn-secondary" title="戻る">
            <i class="fas fa-arrow-left"></i> 戻る
        </a>
    </div>
</div>

<div class="print-container">
    <object 
        class="pdf-preview"
        data="{{ url_for('quotation.quotation_pdf', quotation_id=quotation.id) }}"
        type="application/pdf">
        <p>このブラウザはPDF埋め込みをサポートしていません。<a href="{{ url_for('quotation.quotation_pdf', quotation_id=quotation.id) }}">PDFをダウンロードしてください。</a></p>
    </object>
</div>

{% endblock %}
