{% extends "layout.html" %}
{% block content %}
<div class="container mt-4" style="max-width: 720px;">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h2 class="mb-0">ユーザー登録（管理者専用）</h2>
  </div>

  <div class="alert alert-info">
    管理者のみユーザーを追加できます。登録後はログイン画面からログインしてください。
  </div>

  <form method="post" action="{{ url_for('auth.register_user') }}" class="card">
    <div class="card-body">
      <div class="row g-3">
        <div class="col-md-6">
          <label class="form-label">ログインID（必須）</label>
          <input type="text" name="login_id" class="form-control"
                 value="{{ (form.login_id if form else '') }}" required>
        </div>

        <div class="col-md-6">
          <label class="form-label">表示名（必須）</label>
          <input type="text" name="display_name" class="form-control"
                 value="{{ (form.display_name if form else '') }}" required>
        </div>

        <div class="col-md-6">
          <label class="form-label">パスワード（必須）</label>
          <input type="password" name="password" class="form-control" required>
        </div>

        <div class="col-md-3">
          <label class="form-label">権限</label>
          <select name="role" class="form-select">
            {% set r = (form.role if form else 'user') %}
            <option value="user" {% if r == 'user' %}selected{% endif %}>user</option>
            <option value="admin" {% if r == 'admin' %}selected{% endif %}>administrator</option>
          </select>
        </div>

        <div class="col-md-3">
          <label class="form-label">有効</label>
          {% set a = (form.is_active if form else '1') %}
          <select name="is_active" class="form-select">
            <option value="1" {% if a == '1' %}selected{% endif %}>有効</option>
            <option value="0" {% if a == '0' %}selected{% endif %}>無効</option>
          </select>
        </div>
      </div>

      <div class="mt-4 d-flex gap-2">
        <button class="btn btn-primary" type="submit">登録</button>
        <a class="btn btn-outline-secondary" href="{{ url_for('main.index') }}">メニューへ戻る</a>
      </div>
    </div>
  </form>
</div>
{% endblock %}
